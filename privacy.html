<h1>Clopass プライバシーポリシー</h1>

<p>
本アプリ（Clopass）は、学習支援サービスを提供するために必要な範囲で情報を取り扱います。
</p>

<h2>取得する情報</h2>

<ul>

<li>ログイン情報</li>

<li>ユーザーが作成した問題集データ</li>

<li>カメラで撮影した画像（OCR機能利用時）</li>

<li>アプリ利用に必要な技術情報</li>

</ul>

<h2>利用目的</h2>

<ul>

<li>サービス提供</li>

<li>OCR機能の実行</li>

<li>データ保存・同期</li>

<li>サービス改善</li>

</ul>

<h2>第三者提供</h2>

<p>

法令に基づく場合を除き、本人の同意なく第三者へ提供しません。

</p>

<h2>お問い合わせ</h2>

<p>
